name: Leafy
options:
  bundleIdPrefix: no.leafy
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Leafy:
    type: application
    platform: iOS
    sources:
      - Leafy
      - LeafyClient.swift
    info:
      path: Leafy/Info.plist
      properties:
        CFBundleDisplayName: Leafy
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Leafy connects to your home server to read your car’s battery and request heating.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.leafy.app
  LeafyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LeafyTests]
    dependencies:
      - target: Leafy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LeafyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LeafyUITests]
    dependencies:
      - target: Leafy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Leafy:
    build:
      targets:
        Leafy: all
    test:
      targets:
        - LeafyTests
        - LeafyUITests
      gatherCoverageData: true
