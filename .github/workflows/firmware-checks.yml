name: Firmware checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the 25 behavioral host tests
        env:
          CXX: g++
        run: python3 firmware/leaf-heat/tests/run_host_tests.py
